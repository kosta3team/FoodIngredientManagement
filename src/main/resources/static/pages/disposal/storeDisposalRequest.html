<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>폐기 등록 (직영점) | FoodIngredientManagement</title>
    <!-- IntelliJ 내장 서버 미리보기 및 Spring Boot 실행: Bootstrap CDN (인터넷 연결 필요) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 모든 환경에서 동일한 상대경로 CSS 사용 -->
    <link rel="stylesheet" href="../../css/common.css">
  </head>
  <body>
    <div class="hq-layout d-flex">
      <!-- 공통 사이드바: 상대경로 iframe. Spring Boot/IntelliJ HTTP/file://에서 동일 -->
      <iframe class="hq-sidebar-frame" src="../../fragments/sidebar.html" title="공통 메뉴" loading="eager"></iframe>
      <main class="hq-main">
        <!-- 공통 상단 헤더 -->
        <header class="hq-header d-flex align-items-center px-4 fw-bold">식재료 · 재고 · 폐기 운영 관리</header>
        <div class="hq-content p-4">
          <!-- 페이지 제목 및 사용자 구분 -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="hq-page-title mb-0">폐기 등록 (직영점)</h4>
            <span class="badge text-bg-light border">직영점</span>
          </div>
          <!-- 식재료 및 재고 정보 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">식재료 및 재고 정보</h6>
            <div class="row g-3">
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">식재료</div>
                <div class="fw-semibold">식빵</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">입고일련번호</div>
                <div class="fw-semibold">202601100001</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">재고수량</div>
                <div class="fw-semibold">140개</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">기준단위</div>
                <div class="fw-semibold">개</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">입고일자</div>
                <div class="fw-semibold">2026-11-03</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">소비기한</div>
                <div class="fw-semibold">2026-11-10</div>
              </div>
            </div>
          </section>
          <!-- 폐기 요청 등록 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">폐기 요청 등록</h6>
            <div class="row g-3">
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">폐기요청일시</label>
                <input class="form-control form-control-sm" type="datetime-local" placeholder="" value="2026-11-06T10:10">
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">폐기수량</label>
                <input class="form-control form-control-sm" type="number" placeholder="" value="100">
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">단위</label>
                <select class="form-select form-select-sm">
                  <option selected="">개</option>
                </select>
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">폐기유형</label>
                <select class="form-select form-select-sm">
                  <option selected="">포장 파손</option>
                  <option>소비기한 경과</option>
                  <option>손상</option>
                  <option>품질불량</option>
                  <option>조리실수</option>
                  <option>기타</option>
                </select>
              </div>
            </div>
            <label class="form-label mt-3">폐기 사유</label>
            <textarea class="form-control" rows="3">포장 파손</textarea>
            <div class="d-flex justify-content-end flex-wrap gap-2 mt-3">
              <button type="button" class="btn btn-primary btn-sm" disabled="">폐기 요청</button>
              <a
                class="btn btn-outline-primary btn-sm text-nowrap"
                href="storeDisposalList.html"
              >
                목록
              </a>
            </div>
          </section>
          <!-- 화면에 표시한 자료는 DB 연결 전 고정 예시 데이터 -->
          <p class="small text-secondary mt-3">현재는 UI 스켈레톤입니다. 조회·저장·승인·재고 차감은 실제 처리하지 않습니다.</p>
        </div>
      </main>
    </div>
    <!-- 기존 Bootstrap 보조 JS: 사이드바는 iframe으로 공유 -->
    <script src="../../js/layout.js"></script>
  </body>
</html>
