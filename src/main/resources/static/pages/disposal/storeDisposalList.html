<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>폐기 목록 조회 (직영점) | FoodIngredientManagement</title>
    <!-- IntelliJ 내장 서버 미리보기 및 Spring Boot 실행: Bootstrap CDN (인터넷 연결 필요) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 모든 환경에서 동일한 상대경로 CSS 사용 -->
    <link rel="stylesheet" href="../../css/common.css">
  </head>
  <body>
    <div class="hq-layout d-flex">
      <!-- 공통 사이드바: 상대경로 iframe. Spring Boot/IntelliJ HTTP/file://에서 동일 -->
      <iframe class="hq-sidebar-frame" src="../../fragments/sidebar.html" title="공통 메뉴" loading="eager"></iframe>
      <main class="hq-main">
        <!-- 공통 상단 헤더 -->
        <header class="hq-header d-flex align-items-center px-4 fw-bold">식재료 · 재고 · 폐기 운영 관리</header>
        <div class="hq-content p-4">
          <!-- 페이지 제목 및 사용자 구분 -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="hq-page-title mb-0">폐기 목록 조회 (직영점)</h4>
            <span class="badge text-bg-light border">직영점</span>
          </div>
          <!-- 요약 현황 (화면 확인용 예시 데이터) -->
          <div class="row g-3 mb-3">
            <div class="col-6 col-lg-3">
              <div class="card hq-card p-3 h-100">
                <div class="small text-secondary">이번 달 폐기량</div>
                <div class="fw-bold fs-4">100건</div>
              </div>
            </div>
            <div class="col-6 col-lg-3">
              <div class="card hq-card p-3 h-100">
                <div class="small text-secondary">승인 대기</div>
                <div class="fw-bold fs-4">1건</div>
              </div>
            </div>
            <div class="col-6 col-lg-3">
              <div class="card hq-card p-3 h-100">
                <div class="small text-secondary">거절</div>
                <div class="fw-bold fs-4">0건</div>
              </div>
            </div>
          </div>
          <!-- 조회 조건 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">조회 조건</h6>
            <div class="row g-2 align-items-end">
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">검색 구분</label>
                <select class="form-select form-select-sm">
                  <option selected="">전체</option>
                  <option>폐기번호</option>
                  <option>식재료명</option>
                </select>
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">검색어</label>
                <input class="form-control form-control-sm" type="text" placeholder="번호 또는 식재료" value="">
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">상태</label>
                <select class="form-select form-select-sm">
                  <option selected="">전체</option>
                  <option>대기</option>
                  <option>승인</option>
                  <option>거절</option>
                </select>
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">시작일</label>
                <input class="form-control form-control-sm" type="date" placeholder="" value="2026-11-01">
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">종료일</label>
                <input class="form-control form-control-sm" type="date" placeholder="" value="2026-11-06">
              </div>
              <div class="col-12 col-md-auto">
                <button type="button" class="btn btn-primary btn-sm" disabled="">검색</button>
              </div>
            </div>
          </section>
          <!-- 폐기 요청 목록 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">폐기 요청 목록</h6>
            <div class="d-flex justify-content-end mb-2">
              <a
                class="btn btn-outline-primary btn-sm text-nowrap"
                href="storeDisposalRequest.html"
              >
                폐기 등록
              </a>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle hq-table table-sm mb-0">
                <!-- 테이블 항목 -->
                <thead>
                  <tr>
                    <th scope="col">순번</th>
                    <th scope="col">폐기번호</th>
                    <th scope="col">폐기요청일시</th>
                    <th scope="col">폐기 장소</th>
                    <th scope="col">식재료</th>
                    <th scope="col">폐기수량</th>
                    <th scope="col">단위</th>
                    <th scope="col">폐기유형</th>
                    <th scope="col">처리상태</th>
                    <th scope="col">처리일시</th>
                    <th scope="col">상세</th>
                  </tr>
                </thead>
                <!-- 목록 예시 데이터 (DB 연동 전) -->
                <tbody>
                  <tr>
                    <td>2</td>
                    <td></td> <!-- 처리되면 생성 -->
                    <td>2026-11-06 10:10</td>
                    <td>서울 한국대점</td>
                    <td>식빵</td>
                    <td>100</td>
                    <td>개</td>
                    <td>포장 파손</td>
                    <td>
                      <span class="badge text-bg-warning">대기</span>
                    </td>
                    <td>—</td>
                    <td>
                      <a
                        class="btn btn-outline-primary btn-sm text-nowrap"
                        href="storeDisposalDetail.html"
                      >
                        상세
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
          <!-- 화면에 표시한 자료는 DB 연결 전 고정 예시 데이터 -->
          <p class="small text-secondary mt-3">현재는 UI 스켈레톤입니다. 조회·저장·승인·재고 차감은 실제 처리하지 않습니다.</p>
        </div>
      </main>
    </div>
    <!-- 기존 Bootstrap 보조 JS: 사이드바는 iframe으로 공유 -->
    <script src="../../js/layout.js"></script>
  </body>
</html>
