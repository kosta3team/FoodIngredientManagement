
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<aside class="hq-sidebar p-3 d-flex flex-column justify-content-between">

  <!-- 사이드바 메뉴 -->
  <div>

    <!-- 브랜드 -->
    <a href="/hq/dashboard"
       class="hq-brand d-flex align-items-center gap-2 mb-4 text-decoration-none">
            <span class="brand-text fw-bold fs-5 text-white">
                프랜차이즈 재고 관리
            </span>
    </a>

    <nav class="nav flex-column gap-1" aria-label="업무 메뉴">
      <div sec:authorize="isAuthenticated()">
        로그인 인증 확인
      </div>

      <div sec:authorize="hasRole('HQ')">
        HQ 권한 확인
      </div>

      <div sec:authorize="hasRole('STORE')">
        STORE 권한 확인
      </div>
      <!-- ================= 폐기관리 ================= -->
      <div class="nav-group">

        <a href="#" class="nav-link nav-parent">
          <span aria-hidden="true">♻</span>
          <span class="ms-2">폐기관리</span>
          <span class="ms-auto" aria-hidden="true">⌄</span>
        </a>

        <div class="nav-submenu">

          <!-- 본사 직원 / 본사 관리자 -->
          <a href="/hq/wastes"
             sec:authorize="hasAnyRole('HQ', 'HQ_ADMIN')">
            본사 폐기 목록 조회
          </a>

          <!-- 직영점 직원 -->
          <a href="/store/wastes"
             sec:authorize="hasRole('STORE')">
            직영점 폐기 목록 조회
          </a>

          <!-- 본사 관리자 -->
          <a href="/hq/wastes/statistics"
             sec:authorize="hasRole('HQ_ADMIN')">
            본사 폐기 통계
          </a>

        </div>
      </div>


      <!-- ================= 재고관리 ================= -->
      <div class="nav-group">

        <a href="#" class="nav-link nav-parent">
          <span aria-hidden="true">▣</span>
          <span class="ms-2">재고관리</span>
          <span class="ms-auto" aria-hidden="true">⌄</span>
        </a>

        <div class="nav-submenu">

          <!-- 본사 직원 / 본사 관리자 -->
          <a href="/hq/inventory"
             sec:authorize="hasAnyRole('HQ', 'HQ_ADMIN')">
            본사 재고 목록 조회
          </a>

          <!-- 직영점 직원 -->
          <a href="/store/inventory"
             sec:authorize="hasRole('STORE')">
            직영점 재고 목록 조회
          </a>

        </div>
      </div>


      <!-- ================= 식재료 관리 ================= -->
      <div class="nav-group">

        <a href="#" class="nav-link nav-parent">
          <span aria-hidden="true">🥬</span>
          <span class="ms-2">식재료 관리</span>
          <span class="ms-auto" aria-hidden="true">⌄</span>
        </a>

        <div class="nav-submenu">

          <!-- 본사 직원 / 본사 관리자 -->
          <a href="/hq/ingredients"
             sec:authorize="hasAnyRole('HQ', 'HQ_ADMIN')">
            식재료 목록 조회
          </a>

        </div>
      </div>


      <!-- ================= 발주관리 ================= -->
      <div class="nav-group">

        <a href="#" class="nav-link nav-parent">
          <span aria-hidden="true">🛒</span>
          <span class="ms-2">발주관리</span>
          <span class="ms-auto" aria-hidden="true">⌄</span>
        </a>

        <div class="nav-submenu">

          <!-- 본사 직원 / 본사 관리자 -->
          <a href="/hq/orders"
             sec:authorize="hasAnyRole('HQ', 'HQ_ADMIN')">
            본사 발주 목록 조회
          </a>

          <a href="/hq/orders/detail"
             sec:authorize="hasAnyRole('HQ', 'HQ_ADMIN')">
            본사 발주 상세 조회
          </a>

          <!-- 직영점 직원 -->
          <a href="/store/orders"
             sec:authorize="hasRole('STORE')">
            직영점 발주 목록 조회
          </a>

          <a href="/store/orders/detail"
             sec:authorize="hasRole('STORE')">
            직영점 발주 상세 조회
          </a>

          <a href="/store/orders/request"
             sec:authorize="hasRole('STORE')">
            직영점 발주 요청
          </a>

          <a href="/store/orders/items/add"
             sec:authorize="hasRole('STORE')">
            직영점 발주 품목 추가
          </a>

        </div>
      </div>

    </nav>
  </div>


  <!-- ================= 로그인 정보 ================= -->
  <div class="sidebar-footer pt-3 border-top border-secondary">

    <div class="small mb-2 text-light">

      <!-- 로그인 사용자 이름 -->
      <div class="mb-2">
        <span aria-hidden="true">👤</span>
        <span sec:authentication="principal.userName"></span>
      </div>

      <!-- 본사 관리자 -->
      <div sec:authorize="hasRole('HQ_ADMIN')">
        <span>본사 관리자</span>
      </div>

      <!-- 본사 직원 -->
      <div sec:authorize="hasRole('HQ')">
        <span>본사 직원</span>
      </div>

      <!-- 직영점 직원 -->
      <div sec:authorize="hasRole('STORE')">
        <span>직영점 직원</span>
      </div>

    </div>

    <!-- 로그아웃 -->
    <a href="/logout"
       class="btn btn-outline-light btn-sm w-100 d-flex align-items-center justify-content-center gap-1">

      <span aria-hidden="true">🚪</span>
      <span>로그아웃</span>

    </a>

  </div>

</aside>

</body>
</html>
