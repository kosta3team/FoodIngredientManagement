<!-- fragments/sidebar.html -->
<aside class="hq-sidebar p-3 d-flex flex-column justify-content-between">

  <!-- 상단: 브랜드 및 메뉴 -->
  <div>
    <a href="/dashboard"
       class="hq-brand d-flex align-items-center gap-2 mb-4 text-decoration-none">
            <span class="brand-text fw-bold fs-5 text-white">
                프랜차이즈 재고 관리
            </span>
    </a>

    <nav class="nav flex-column gap-1">

      <!-- 기존 메뉴 그룹 구조를 보존하면서 유효한 화면 URL만 연결한다. -->
      <div class="nav-group">
        <a class="nav-link nav-parent" href="/dashboard"><span>⌂</span> 메인 대시보드</a>
      </div>

      <!-- 폐기관리 -->
      <div class="nav-group">
        <a href="/hq/disposal/list"
           class="nav-link nav-parent">
          <span>♻</span>
          <span class="ms-2">폐기관리</span>
          <span class="ms-auto">⌄</span>
        </a>

        <div class="nav-submenu">
          <a href="/hq/disposal/list">폐기 목록 조회</a>
          <a href="/hq/disposal/request">본사 폐기 등록</a>
          <a href="/store/disposal/list">직영점 폐기 조회</a>
          <a href="/store/disposal/request">직영점 폐기 등록</a>
        </div>
      </div>

      <!-- 재고관리 -->
      <div class="nav-group">
        <a href="/inventory/list"
           class="nav-link nav-parent">
          <span>▣</span>
          <span class="ms-2">재고관리</span>
          <span class="ms-auto">⌄</span>
        </a>

        <div class="nav-submenu">
          <a href="/inventory/list">본사 재고 조회</a>
        </div>
      </div>

      <!-- 식재료 관리 -->
      <div class="nav-group">
        <a href="/ingredients/list"
           class="nav-link nav-parent">
          <span>🥬</span>
          <span class="ms-2">식재료 관리</span>
          <span class="ms-auto">⌄</span>
        </a>

        <div class="nav-submenu">
          <a href="/ingredients/list">본사 식재료 조회</a>
          <a href="/ingredients/request">본사 식재료 등록</a>
        </div>
      </div>

      <!-- 발주관리 -->
      <div class="nav-group">
        <a href="/orders/list"
           class="nav-link nav-parent">
          <span>🛒</span>
          <span class="ms-2">발주관리</span>
          <span class="ms-auto">⌄</span>
        </a>

        <div class="nav-submenu">
          <a href="/orders/list">본사 발주 조회</a>
          <a href="/store/orders/request">직영점 발주 요청</a>
          <a href="/store/orders/list">직영점 발주 요청 조회</a>
        </div>
      </div>

    </nav>
  </div>

  <!-- 하단: 관리자 정보 및 로그아웃 -->
  <div class="sidebar-footer pt-3 border-top border-secondary">

    <div class="small mb-2 d-flex align-items-center justify-content-between text-light">
      <span>
        👤 <span >사용자</span>
      </span>
      <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy.MM.dd')}">
        2026.11.03
      </span>
    </div>

    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn btn-outline-light btn-sm w-100">
        로그아웃
      </button>
    </form>

  </div>

</aside>
