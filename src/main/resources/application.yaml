server:
  port: 8881

spring:
  application:
    name: FoodIngredientManagement
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/mydb?characterEncoding=UTF-8
    username: mydbid
    password: mydbpw
  jpa:
    open-in-view: false
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    check-template-location: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB


file:
  upload-dir: C:/2ndSprint/MultiFile

mybatis:
  mapper-locations: classpath:mappers/*.xml

pagehelper:
  helper-dialect: mariadb
  reasonable: true
  support-methods-arguments: false
  params: count=countSql