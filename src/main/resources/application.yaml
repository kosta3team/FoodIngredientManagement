server:
  port: 8881

spring:
  application:
    name: FoodIngredientManagement
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/mydb?characterEncoding=UTF-8
    username: mydbid
    password: mydbpw
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    check-template-location: true

  # 테스트 진입용 테이블 생성 - 추후 테이블 확정 되면 그에 따라 조정
  sql:
    init:
      mode: always # 이건 개발이 완료되면 never로 수정
      schema-locations: classpath:db/sprint2_schema.sql
      encoding: UTF-8
      continue-on-error: false

mybatis:
  mapper-locations: classpath:mappers/*.xml
# 테이블 생성 SQL은 db/sprint2_schema.sql을 MariaDB에서 1회 수동 실행합니다.
# 기존 데이터와 충돌하지 않게 sprint2_ 접두사 테이블만 사용합니다.
