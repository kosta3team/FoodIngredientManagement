<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        재고 목록 조회 (직영점)
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div class="hq-layout d-flex">

    <div th:replace="~{fragment/sidebar :: sidebarFragment}"></div>
    <main class="hq-main">
        <div class="hq-content p-4">
            <!-- 페이지 제목 및 이동 메뉴 -->
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h4 class="hq-page-title mb-0">
                    전체 재고 목록 조회 (직영점)
                </h4>
            </div>
            <!-- 검색 조건: 화면 구성만 제공하며 데이터는 예시 값 -->
            <section class="card hq-card p-3 mb-3">
                <div class="row g-3 align-items-center">
                    <div class="col-md-3">
                        <div class="d-flex align-items-center gap-2">

                                <label class="form-label mb-0 text-nowrap" for="subCategoryName">분류</label>

                            <select class="form-select" id="subCategoryName" name="subCategoryName">
                                <option value="">전체</option>
                                <option th:each="category : ${subCategoryList}"
                                        th:value="${category}"
                                        th:text="${category}"
                                        th:selected="${filter != null and category == filter.subCategoryName}">계란류</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="d-flex align-items-center gap-2">
                            <label class="form-label mb-0 text-nowrap" for="ingredientName">식재료명</label>
                            <input class="form-control" id="ingredientName" name="ingredientName" type="text"
                                   placeholder="식재료명을 입력하세요"
                                   th:value="${filter != null ? filter.ingredientName : null}"/>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary px-4" id="searchBtn" type="button">검색</button>
                    </div>

                </div>
            </section>
            <!-- 재고 목록: 화면 구성만 제공하며 데이터는 예시 값 -->
            <section class="card hq-card p-3 mb-3">
                <h6 class="fw-bold mb-3">
                    재고 목록
                </h6>
                <div class="table-responsive">
                    <table class="table table-hover align-middle hq-table mb-0">
                        <thead>
                        <tr>
                            <th scope="col">
                                번호
                            </th>
                            <th scope="col">
                                분류
                            </th>
                            <th scope="col">
                                식재료명
                            </th>
                            <th scope="col">
                                보관유형
                            </th>
                            <th scope="col">
                                잔여수량
                            </th>
                            <th scope="col">
                                담당자
                            </th>
                            <th scope="col">
                                상세
                            </th>
                            <th scope="col">
                                폐기
                            </th>
                        </tr>
                        </thead>
                        <tbody id = "inventoryTableBody">
                        <tr th:each = "item, stat : ${list}">
                            <td th:text = "${stat.count}">1</td>
                            <td th:text = "${item.subCategoryName}">계란류</td>
                            <td th:text = "${item.ingredientName}">계란</td>
                            <td th:text = "${item.storageType}"> 냉장</td>
                            <td th:text="|${item.currentQuantity} ${item.orderUnit}|">3 판</td>
                            <td th:text="${item.userName ?: '-'}"> 김담당 </td>

                            <td>
                                <button type="button" class="btn btn-outline-primary btn-sm btn-detail"
                                        th:data-store-id="${item.storeId}"
                                        th:data-ingredient-id="${item.ingredientId}">
                                    상세 보기
                                </button>
                            </td>

                            <td>
                                <a class="btn btn-outline-secondary btn-sm" href="#" th:href="@{/inventory/disposal-request/101}">
                                    폐기 요청
                                </a>
                            </td>
                        </tr>





                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>

<!-- 재고 상세 모달: storeInventoryDetail.html -->
<div class="modal" id="storeInventoryDetailModal" tabindex="-1" aria-labelledby="storeInventoryDetailModalLabel"
     aria-hidden="true" role="dialog">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title hq-page-title mb-0" id="storeInventoryDetailModalLabel">
                    재고 상세조회
                </h4>
                <button type="button" class="btn-close" data-modal-close aria-label="닫기"></button>
            </div>
            <div class="modal-body" id="storeInventoryDetailModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-modal-close>
                    닫기
                </button>
            </div>
        </div>
    </div>
</div>
<div class="modal-backdrop show d-none" id="storeInventoryDetailBackdrop"></div>

<script src="/js/storeInventoryDetail.js" defer></script>
<script src="/js/storeInventoryList.js" defer></script>

</body>
</html>
