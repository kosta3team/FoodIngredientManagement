<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
      재고 목록 조회 (본사)
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
  </head>
  <body>
    <div class="hq-layout d-flex">

      <div th:replace="~{fragment/sidebar :: sidebarFragment}"></div>

      <main class="hq-main">
        <div class="hq-content p-4">
          <!-- 페이지 제목 및 이동 메뉴 -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="hq-page-title mb-0">
              전체 재고 목록 조회 (본사)
            </h4>
          </div>
          <!-- 검색 조건: 화면 구성만 제공하며 데이터는 예시 값 -->
          <section class="card hq-card p-3 mb-3">
            <div class="row g-3 align-items-center">
              <div class="col-md-2">
                <div class="d-flex align-items-center gap-2">
                  <label class="form-label mb-0 text-nowrap" for="ingredient">식재료명</label>
                  <select class="form-select" id="ingredient" name="ingredientId">
                    <option value="">전체</option>
                  </select>
                </div>
              </div>
              <div class="col-md-3">
                <div class="d-flex align-items-center gap-2">
                  <label class="form-label mb-0 text-nowrap" for="storeName">직영점명</label>
                  <input class="form-control" id="storeName" name="storeName" type="text" placeholder="직영점명을 입력하세요"/>
                </div>
              </div>

              <!-- 기간 조회 -->
              <div class="col-md">
                <div class="d-flex align-items-center gap-2">
                  <label class="form-label mb-0 text-nowrap" for="dateType">기간</label>
                  <div class="input-group">
                    <select class="form-select flex-grow-0" id="dateType" name="dateType" style="width:130px">
                      <option value="">전체 기간</option>
                      <option value="receivedAt">입고일시</option>
                      <option value="expiryDate">소비기한</option>
                    </select>
                    <input class="form-control" id="startDate" name="startDate" type="date"/>
                    <span class="input-group-text">~</span>
                    <input class="form-control" id="endDate" name="endDate" type="date"/>
                  </div>
                </div>
              </div>
              <div class="col-md-2 d-flex gap-2 justify-content-md-end">
                <button class="btn btn-primary px-4" id="searchBtn" type="button">검색</button>
              </div>
            </div>
          </section>
          <!-- 재고 목록: 화면 구성만 제공하며 데이터는 예시 값 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">
              재고 목록
            </h6>
            <div class="table-responsive">
              <table class="table table-hover align-middle hq-table mb-0">
                <thead>
                <tr>
                  <th scope="col">
                    번호
                  </th>
                  <th scope="col">
                    직영점명
                  </th>
                  <th scope="col">
                    식재료명
                  </th>
                  <th scope="col">
                    보관유형
                  </th>
                  <th scope="col">
                    잔여수량
                  </th>
                  <th scope="col">
                    입고일시
                  </th>
                  <th scope="col">
                    소비기한
                  </th>
                  <th scope="col">
                    담당자
                  </th>
                  <th scope="col">
                    상세
                  </th>
                  <th scope="col">
                    폐기
                  </th>
                </tr>
                </thead>

                <tbody id="inventoryTableBody">
                <tr>
                  <td colspan="10" class="text-center text-secondary py-4">불러오는 중...</td>
                </tr>
                </tbody>

              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="modal" id="hqInventoryDetailModal" tabindex="-1" aria-labelledby="hqInventoryDetailModalLabel"
         aria-hidden="true" role="dialog">
      <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title hq-page-title mb-0" id="hqInventoryDetailModalLabel">
              재고 상세조회
            </h4>
            <button type="button" class="btn-close" data-modal-close aria-label="닫기"></button>
          </div>
          <div class="modal-body" id="hqInventoryDetailModalBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-modal-close>
              닫기
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-backdrop show d-none" id="hqInventoryDetailBackdrop"></div>
    <script src="/js/hqInventoryDetail.js" defer></script>
    <script src="/js/hqInventoryList.js" defer></script>
  </body>
</html>
