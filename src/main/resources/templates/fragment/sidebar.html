<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<aside th:fragment="sidebarFragment"
       class="hq-sidebar p-3 d-flex flex-column justify-content-between">

  <div>
    <!-- 로고 -->
    <a th:href="@{/hq/dashboard}"
       class="hq-brand d-flex align-items-center gap-2 mb-4 text-decoration-none">
            <span class="brand-text fw-bold fs-5 text-white">
                프랜차이즈 재고 관리
            </span>
    </a>

    <nav class="nav flex-column gap-1" aria-label="업무 메뉴">
      <div sec:authorize="isAuthenticated()">
        로그인 인증 확인
      </div>

      <div sec:authorize="hasRole('HQ')">
        HQ 권한 확인
      </div>

      <div sec:authorize="hasRole('STORE')">
        STORE 권한 확인
      </div>
      <!-- ================================= -->
      <!-- 본사 전용 메뉴 : HQ / HQ_ADMIN -->
      <!-- ================================= -->
      <th:block sec:authorize="hasAnyRole('HQ', 'HQ_ADMIN')">

        <!-- 폐기관리 -->
        <div class="nav-group">
          <a href="#" class="nav-link nav-parent">
            <span aria-hidden="true">♻</span>
            <span class="ms-2">폐기관리</span>
            <span class="ms-auto" aria-hidden="true">⌄</span>
          </a>

          <div class="nav-submenu">
            <a th:href="@{/hq/wastes}">본사 폐기 목록 조회</a>
            <a th:href="@{/hq/wastes/statistics}">본사 폐기 통계</a>
          </div>
        </div>

        <!-- 재고관리 -->
        <div class="nav-group">
          <a href="#" class="nav-link nav-parent">
            <span aria-hidden="true">▣</span>
            <span class="ms-2">재고관리</span>
            <span class="ms-auto" aria-hidden="true">⌄</span>
          </a>

          <div class="nav-submenu">
            <a th:href="@{/hq/inventory}">본사 재고 목록 조회</a>
          </div>
        </div>

        <!-- 식재료 관리 -->
        <div class="nav-group">
          <a href="#" class="nav-link nav-parent">
            <span aria-hidden="true">🥬</span>
            <span class="ms-2">식재료 관리</span>
            <span class="ms-auto" aria-hidden="true">⌄</span>
          </a>

          <div class="nav-submenu">
            <a th:href="@{/hq/ingredients}">식재료 목록 조회</a>
          </div>
        </div>

        <!-- 본사 발주관리 -->
        <div class="nav-group">
          <a href="#" class="nav-link nav-parent">
            <span aria-hidden="true">🛒</span>
            <span class="ms-2">발주관리</span>
            <span class="ms-auto" aria-hidden="true">⌄</span>
          </a>

          <div class="nav-submenu">
            <a th:href="@{/hq/orders}">본사 발주 목록 조회</a>
            <a th:href="@{/hq/orders/detail}">본사 발주 상세 조회</a>
          </div>
        </div>

      </th:block>


      <!-- ================================= -->
      <!-- 직영점 전용 메뉴 : STORE -->
      <!-- ================================= -->
      <th:block sec:authorize="hasRole('STORE')">

        <!-- 폐기관리 -->
        <div class="nav-group">
          <a href="#" class="nav-link nav-parent">
            <span aria-hidden="true">♻</span>
            <span class="ms-2">폐기관리</span>
            <span class="ms-auto" aria-hidden="true">⌄</span>
          </a>

          <div class="nav-submenu">
            <a th:href="@{/store/wastes}">직영점 폐기 목록 조회</a>
          </div>
        </div>

        <!-- 재고관리 -->
        <div class="nav-group">
          <a href="#" class="nav-link nav-parent">
            <span aria-hidden="true">▣</span>
            <span class="ms-2">재고관리</span>
            <span class="ms-auto" aria-hidden="true">⌄</span>
          </a>

          <div class="nav-submenu">
            <a th:href="@{/store/inventory}">직영점 재고 목록 조회</a>
          </div>
        </div>

        <!-- 발주관리 -->
        <div class="nav-group">
          <a href="#" class="nav-link nav-parent">
            <span aria-hidden="true">🛒</span>
            <span class="ms-2">발주관리</span>
            <span class="ms-auto" aria-hidden="true">⌄</span>
          </a>

          <div class="nav-submenu">
            <a th:href="@{/store/orders}">직영점 발주 목록 조회</a>
            <a th:href="@{/store/orders/detail}">직영점 발주 상세 조회</a>
            <a th:href="@{/store/orders/request}">직영점 발주 요청</a>
            <a th:href="@{/store/orders/items/add}">직영점 발주 품목 추가</a>
          </div>
        </div>

      </th:block>

    </nav>
  </div>


  <!-- ================================= -->
  <!-- 하단 사용자 정보 -->
  <!-- ================================= -->
  <div class="sidebar-footer pt-3 border-top border-secondary">

    <div class="small mb-2 d-flex align-items-center justify-content-between text-light">

      <!-- 본사 관리자 -->
      <span sec:authorize="hasRole('HQ_ADMIN')">
                👤 본사 관리자
            </span>

      <!-- 본사 직원 -->
      <span sec:authorize="hasRole('HQ')">
                👤 본사 직원
            </span>

      <!-- 직영점 직원 -->
      <span sec:authorize="hasRole('STORE')">
                👤 직영점 직원
            </span>

      <span>2026.11.03</span>
    </div>

    <!-- 로그아웃 -->
    <a th:href="@{/logout}"
       class="btn btn-outline-light btn-sm w-100 d-flex align-items-center justify-content-center gap-1">
      <span aria-hidden="true">🚪</span>
      <span>로그아웃</span>
    </a>

  </div>

</aside>

</body>
</html>
