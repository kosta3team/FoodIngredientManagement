<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>본사 - 식재료 등록</title>
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/common.css" rel="stylesheet"/>
</head>
<body>
<div class="hq-layout d-flex">
    <div id="sidebar-container"></div>
    <main class="hq-main">
        <header class="hq-header d-flex align-items-center px-4 fw-bold">식재료 · 재고 · 폐기 운영 관리</header>
        <div class="hq-content p-4">
            <div class="d-flex justify-content-between flex-wrap gap-2 align-items-center mb-3"><h4
                    class="hq-page-title mb-0">식재료 등록 (본사)</h4><a class="btn btn-outline-secondary"
                                                                  href="/ingredients/list">목록으로</a></div>
            <div class="card hq-card p-3">
                <form id="ingredientRequestForm"><h6 class="fw-bold mb-3">식재료 정보</h6>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label fw-semibold" for="ingredientImage">식재료 사진</label><input
                                accept="image/*" class="form-control" id="ingredientImage" name="image" type="file"/>
                            <div class="small text-secondary mt-1">이미지 첨부 저장은 이후 스프린트에서 구현합니다.</div>
                            <div class="border rounded bg-light p-4 text-center text-secondary mt-2">이미지 업로드 영역</div>
                        </div>
                        <div class="col-md-8">
                            <div class="mb-3"><label class="form-label fw-semibold"
                                                     for="ingredientName">식재료명</label><input class="form-control"
                                                                                             id="ingredientName"
                                                                                             name="name"
                                                                                             placeholder="예: 토마토"
                                                                                             required=""/></div>
                            <div class="row g-2">
                                <div class="col-md-6"><label class="form-label fw-semibold"
                                                             for="ingredientCategory">대분류</label><select
                                        class="form-select" id="ingredientCategory" required="">
                                    <option value="">대분류 선택</option>
                                    <option>비가공식품</option>
                                    <option>가공식품</option>
                                </select></div>
                                <div class="col-md-6"><label class="form-label fw-semibold"
                                                             for="ingredientGroup">세부분류</label><select
                                        class="form-select" id="ingredientGroup" required="">
                                    <option value="">분류 선택</option>
                                    <option>채소류</option>
                                    <option>육류</option>
                                    <option>유제품</option>
                                    <option>빵류</option>
                                    <option>소스/조미료</option>
                                </select></div>
                            </div>
                            <div class="row g-2 mt-2">
                                <div class="col-md-6"><label class="form-label fw-semibold" for="ingredientUnit">입고
                                    단위</label><input class="form-control" id="ingredientUnit" placeholder="예: 1kg/봉"
                                                     required=""/></div>
                                <div class="col-md-6"><label class="form-label fw-semibold" for="ingredientPrice">공급 단가
                                    (원)</label><input class="form-control" id="ingredientPrice" min="0" required=""
                                                      type="number"/></div>
                            </div>
                        </div>
                    </div>
                    <hr/>
                    <h6 class="fw-bold mb-3">보관 규칙</h6>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label fw-semibold"
                                                     for="storageType">보관유형</label><select class="form-select"
                                                                                           id="storageType">
                            <option>냉장</option>
                            <option>실온</option>
                            <option>냉동</option>
                        </select></div>
                        <div class="col-md-4"><label class="form-label fw-semibold" for="expiryDays">사용기한 설정 (일)</label><input
                                class="form-control" id="expiryDays" min="1" required="" type="number"/></div>
                        <div class="col-md-4"><label class="form-label fw-semibold" for="safetyDays">사용기한 알림 (며칠
                            전)</label><input class="form-control" id="safetyDays" min="0" type="number" value="3"/>
                        </div>
                    </div>
                    <div class="text-end mt-4"><a class="btn btn-outline-secondary me-2" href="/ingredients/list">취소</a>
                        <button class="btn btn-primary" type="submit">등록</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="/js/api.js"></script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/pageDemo.js"></script>
<script src="/js/ingredientRegister.js"></script>
</body>
</html>
