
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>본사 - 식재료 조회</title>

    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/common.css" rel="stylesheet"/>
</head>
<body>

<div class="hq-layout d-flex">

    <!-- 사이드바 -->
    <div id="sidebar-container"></div>

    <!-- 메인 영역 -->
    <main class="hq-main">

        <header class="hq-header d-flex align-items-center px-4 fw-bold">
            식재료 · 재고 · 폐기 운영 관리
        </header>

        <div class="hq-content p-4">

            <!-- 페이지 제목 -->
            <div class="d-flex justify-content-between flex-wrap gap-2 align-items-center mb-3">
                <h4 class="hq-page-title mb-0">식재료 목록 조회 (본사)</h4>
            </div>

            <!-- 검색 필터 -->
            <div class="card hq-card p-3 mb-3">
                <form class="row g-2 align-items-end"
                      data-search-table="ingredientTable">

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">검색</label>
                        <input
                                type="text"
                                class="form-control"
                                name="keyword"
                                placeholder="식재료명을 입력하세요"/>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">분류</label>
                        <select class="form-select" name="category">
                            <option value="">전체 분류</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">보관유형</label>
                        <select class="form-select" name="storageType">
                            <option value="">전체 보관유형</option>
                        </select>
                    </div>

                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">
                            검색
                        </button>
                    </div>

                </form>
            </div>

            <!-- 식재료 목록 -->
            <div class="card hq-card p-3">

                <div class="table-responsive">
                    <table class="table table-hover align-middle text-center"
                           id="ingredientTable">

                        <thead class="table-light">
                        <tr>
                            <th style="width: 5%;">
                                <input type="checkbox"
                                       class="form-check-input"
                                       id="selectAllIngredients"/>
                            </th>
                            <th>식재료명</th>
                            <th>분류</th>
                            <th>용량 단위</th>
                            <th>보관유형</th>
                            <th>단가</th>
                            <th>상세</th>
                        </tr>
                        </thead>

                        <tbody>
                        <!-- pageDemo.js에서 데이터 렌더링 -->
                        </tbody>

                    </table>
                </div>

                <!-- 페이징 정보 -->
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <small class="text-muted" id="ingredientPageInfo">
                        총 0개 품목 / 0/0 페이지
                    </small>
                </div>

                <!-- 페이징 버튼 -->
                <nav class="d-flex justify-content-center mt-3"
                     aria-label="식재료 목록 페이지">

                    <ul class="pagination mb-0"
                        id="ingredientPagination">
                    </ul>

                </nav>

                <!-- 하단 버튼 -->
                <div class="d-flex justify-content-end gap-2 mt-3">

                    <button
                            type="button"
                            class="btn btn-outline-danger"
                            id="deleteSelectedIngredients">
                        선택항목 삭제
                    </button>

                    <button
                            type="button"
                            class="btn btn-primary"
                            onclick="openIngredientRegisterModal()">
                        식재료 등록
                    </button>

                </div>

            </div>

        </div>
    </main>
</div>


<!-- 공통 상세 모달 -->
<div class="modal fade"
     id="commonDetailModal"
     tabindex="-1"
     aria-labelledby="commonModalTitle"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content">

            <!-- 모달 헤더 -->
            <div class="modal-header border-bottom">

                <h5 class="modal-title fw-bold"
                    id="commonModalTitle">
                    상세 정보
                </h5>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="닫기">
                </button>

            </div>

            <!-- AJAX 상세 내용 -->
            <div class="modal-body" id="commonModalBody">
                상세 정보를 불러오는 중입니다.
            </div>

            <!-- 모달 하단 -->
            <div class="modal-footer">

                <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    닫기
                </button>

            </div>

        </div>
    </div>
</div>


<!-- JS -->
<script src="/js/api.js"></script>

<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/ingredientDetailModal.js"></script>
<script src="/js/pageDemo.js"></script>
<script src="/js/ingredientRegister.js"></script>
</body>
</html>
