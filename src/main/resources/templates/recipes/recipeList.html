<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>레시피 및 사용 규칙 조회 | FoodIngredientManagement</title>
    <!-- IntelliJ 내장 서버 미리보기 및 Spring Boot 실행: Bootstrap CDN (인터넷 연결 필요) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 모든 환경에서 동일한 상대경로 CSS 사용 -->
    <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  </head>
  <body>
    <div class="hq-layout d-flex">
      <!-- 공통 사이드바: 상대경로 iframe. Spring Boot/IntelliJ HTTP/file://에서 동일 -->
      <iframe class="hq-sidebar-frame" src="../../static/fragments/sidebar.html" th:src="@{/fragments/sidebar.html}" title="공통 메뉴" loading="eager"></iframe>
      <main class="hq-main">
        <!-- 공통 상단 헤더 -->
        <header class="hq-header d-flex align-items-center px-4 fw-bold">식재료 · 재고 · 폐기 운영 관리</header>
        <div class="hq-content p-4">
          <!-- 페이지 제목 및 사용자 구분 -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="hq-page-title mb-0">레시피 및 사용 규칙 조회</h4>
            <span class="badge text-bg-light border">본사</span>
          </div>
          <!-- 조회 조건 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">조회 조건</h6>
            <div class="row g-2 align-items-end">
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">검색 구분</label>
                <select class="form-select form-select-sm">
                  <option selected="">전체</option>
                  <option>레시피명</option>
                  <option>식재료명</option>
                </select>
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">검색어</label>
                <input class="form-control form-control-sm" type="text" placeholder="레시피/식재료" value="">
              </div>
              <div class="col-12 col-md-auto">
                <button type="button" class="btn btn-primary btn-sm" disabled="">검색</button>
              </div>
            </div>
          </section>
          <!-- 레시피 목록 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">레시피 목록</h6>
            <div class="d-flex justify-content-end mb-2">
              <a
                class="btn btn-outline-primary btn-sm text-nowrap"
                href="recipeDetail.html"
              >
                레시피 등록
              </a>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle hq-table table-sm mb-0">
                <!-- 테이블 항목 -->
                <thead>
                  <tr>
                    <th scope="col">레시피번호</th>
                    <th scope="col">메뉴명</th>
                    <th scope="col">1회 생산량</th>
                    <th scope="col">사용재료수</th>
                    <th scope="col">기준</th>
                    <th scope="col">상세</th>
                  </tr>
                </thead>
                <!-- 목록 예시 데이터 (DB 연동 전) -->
                <tbody>
                  <tr>
                    <td>0001</td>
                    <td>양상추 샐러드</td>
                    <td>1개</td>
                    <td>3종</td>
                    <td>1인분</td>
                    <td>
                      <a
                        class="btn btn-outline-primary btn-sm text-nowrap"
                        href="recipeDetail.html"
                      >
                        상세
                      </a>
                    </td>
                  </tr>
                  <tr>
                    <td>0002</td>
                    <td>샌드위치</td>
                    <td>1개</td>
                    <td>2종</td>
                    <td>1인분</td>
                    <td>
                      <a
                        class="btn btn-outline-primary btn-sm text-nowrap"
                        href="recipeDetail.html"
                      >
                        상세
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
          <!-- 화면에 표시한 자료는 DB 연결 전 고정 예시 데이터 -->
          <p class="small text-secondary mt-3">현재는 UI 스켈레톤입니다. 조회·저장·승인·재고 차감은 실제 처리하지 않습니다.</p>
        </div>
      </main>
    </div>
    <!-- 기존 Bootstrap 보조 JS: 사이드바는 iframe으로 공유 -->
    <script src="../../static/js/layout.js" th:src="@{/js/layout.js}"></script>
  </body>
</html>
