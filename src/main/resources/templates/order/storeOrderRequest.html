```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>발주 요청 등록 (직영점) | FoodIngredientManagement</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<div class="hq-layout d-flex">

  <!-- 공통 사이드바 -->
  <div th:replace="~{fragment/sidebar :: sidebarFragment}"></div>

  <main class="hq-main">

    <!-- 공통 헤더 -->
    <header class="hq-header d-flex align-items-center px-4 fw-bold">
      식재료 · 재고 · 폐기 운영 관리
    </header>

    <div class="hq-content p-4">

      <!-- 페이지 제목 / 현재 직영점 -->
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">

        <h4 class="hq-page-title mb-0">
          발주요청(직영점)
        </h4>

        <span class="badge text-bg-light border">
                    지점: 서울 한국대점
                </span>

      </div>

      <!-- 발주 등록 폼 -->
      <form id="orderRequestForm">

        <!-- 발주 품목 작성 -->
        <section class="card hq-card p-3 mb-3">

          <h6 class="fw-bold mb-3">
            발주 품목 작성
          </h6>

          <div class="table-responsive">

            <table class="table table-hover align-middle hq-table table-sm mb-0">

              <thead>
              <tr>
                <th scope="col" class="text-center">순번</th>
                <th scope="col">품목 선택</th>
                <th scope="col">현재 수량</th>
                <th scope="col">주문 수량</th>
                <th scope="col">공급가액(단가)</th>
                <th scope="col">주문금액</th>
                <th scope="col">삭제</th>
              </tr>
              </thead>

              <!-- JS에서 DB 식재료 데이터로 행 생성 -->
              <tbody id="orderRequestItemBody">
              </tbody>

            </table>

          </div>

          <!-- 품목 추가 -->
          <div class="d-flex justify-content-end mt-3">

            <button type="button"
                    id="addOrderItemBtn"
                    class="btn btn-outline-primary btn-sm">
              + 품목 추가
            </button>

          </div>

        </section>

        <!-- 발주 금액 요약 / 등록 버튼 -->
        <section class="card hq-card p-3 mb-3">

          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                        <span class="text-secondary">
                            선택된 품목:
                            <strong id="selectedIngredientCount" class="text-dark">0</strong>개
                        </span>

            <div class="d-flex align-items-center gap-2 flex-wrap">

                            <span class="small">
                                총 발주금액:
                                <strong id="orderTotalPrice">0</strong>원
                            </span>

              <!-- 저장 API 연결 전 -->
              <button type="button"
                      id="submitOrderBtn"
                      class="btn btn-primary btn-sm">
                발주 요청 완료
              </button>

            </div>

          </div>

        </section>

      </form>

      <!-- 발주 목록 이동 -->
      <a href="storeOrderList.html"
         class="btn btn-outline-secondary btn-sm">
        발주 목록으로
      </a>

    </div>

  </main>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 발주 요청 JS -->
<script src="/js/storeOrderRequest.js"></script>

</body>
</html>
```
