<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 그린매니저</title>

  <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/login.css}">

</head>

<body>

<div class="auth-wrapper">
  <div class="card auth-card p-4 p-md-5">

    <div class="text-center mb-4">
      <h2 class="auth-logo mb-2">그린매니저</h2>
      <h5 class="fw-bold">로그인</h5>
      <p class="auth-subtitle mb-0">
        식자재 및 매장 관리 시스템에 오신 것을 환영합니다.
      </p>
    </div>

    <form th:action="@{/login}" method="post">

      <div class="mb-3">
        <label for="id" class="form-label fw-semibold">아이디</label>
        <input type="text"
               class="form-control"
               id="id"
               name="id"
               placeholder="아이디를 입력하세요"
               required autofocus>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">비밀번호</label>
        <input type="password"
               class="form-control"
               id="password"
               name="password"
               placeholder="비밀번호를 입력하세요"
               required>
      </div>

      <div th:if="${param.error}"
           class="alert alert-danger py-2 small">
        아이디 또는 비밀번호가 올바르지 않습니다.
      </div>

      <div th:if="${param.logout}"
           class="alert alert-success py-2 small">
        로그아웃되었습니다.
      </div>

      <button type="submit" class="btn btn-auth w-100">
        로그인
      </button>

    </form>

    <div class="text-center mt-4">
      <span class="text-secondary small">아직 계정이 없으신가요?</span>
      <a th:href="@{/join}"
         class="text-primary text-decoration-none fw-semibold ms-1">
        회원가입
      </a>
    </div>

  </div>
</div>

<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>

</body>
</html>
