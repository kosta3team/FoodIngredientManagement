<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>폐기 조회</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/disposal_stylesheet.css">
    <style>
        .disposal-search-card .search-filters {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: .5rem;
        }

        .disposal-search-card .search-field {
            flex: 1 1 8rem;
            min-width: 0;
        }

        .disposal-search-card .request-period-column {
            flex: 2 1 24rem;
            min-width: min(100%, 24rem);
        }

        .disposal-search-card .request-period-controls {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: .375rem;
        }

        .disposal-search-card .request-period-dates {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: .375rem;
        }

        .disposal-search-card .request-period-dates input[type="date"] {
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            height: 2rem;
            min-height: 2rem;
            padding: .125rem .375rem;
            font-size: .9375rem;
        }

        .disposal-search-card .request-period-toggle {
            width: 2rem;
            height: 2rem;
            padding: 0;
            font-size: 1.125rem;
        }

        .disposal-search-card .search-actions {
            display: flex;
            gap: .375rem;
            margin-left: auto;
            white-space: nowrap;
        }

        .request-period-toggle[aria-expanded="false"] .collapse-minus,
        .request-period-toggle[aria-expanded="true"] .collapse-plus {
            display: none;
        }

        .hq-layout > .hq-main {
            flex: 1 1 0%;
            min-width: 0;
            max-width: none;
        }

        .hq-main > .disposal-content {
            width: 100%;
            max-width: none;
        }

        /* 남는 화면 높이를 폐기 목록이 채우고, 목록 내부만 스크롤 */
        .hq-layout {
            height: 100vh;
            overflow: hidden;
        }

        .hq-layout > .hq-main {
            height: 100vh;
            min-height: 0;
            overflow: hidden;
        }

        .hq-main > .disposal-content {
            height: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #disposalResults {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        #disposalResults > .disposal-list-card {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        #disposalResults > .disposal-list-card > .card-body {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        #disposalResults .disposal-table-scroll {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
        }

        #disposalResults .list-toolbar,
        #disposalResults .pagination-center,
        #disposalResults .list-footer {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
<div class="hq-layout d-flex">
    <div th:replace="~{fragment/sidebar :: sidebarFragment}"></div>
    <main class="hq-main">
        <div class="disposal-content p-4 p-xl-5">

            <!-- 폐기 현황: 화면 예시 수치 (추후 서버 데이터 연동) -->
            <div class="pending-strip mb-3" aria-label="폐기 현황"
                 style="display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; padding:0; border-left:1px solid var(--disposal-border,#e7ebf1); overflow:hidden;">
                <div class="d-flex align-items-center justify-content-center gap-2"
                     style="padding:13px 8px; background:#fff3e6; border-left:3px solid #e58a20; min-width:0; white-space:nowrap;">
                    <span class="fw-semibold" style="color:#a95608;">대기</span>
                    <span class="pending-count" id="pendingDisposalCount" style="color:#a95608;">12건</span>
                </div>
                <div class="d-flex align-items-center justify-content-center gap-2"
                     style="padding:13px 8px; border-left:1px solid #e7ebf1; min-width:0; white-space:nowrap;">
                    <span class="fw-semibold">금일 폐기건수</span>
                    <span class="pending-count" id="todayDisposalCount">0건</span>
                </div>
                <div class="d-flex align-items-center justify-content-center gap-2"
                     style="padding:13px 8px; border-left:1px solid #e7ebf1; min-width:0; white-space:nowrap;">
                    <span class="fw-semibold">금일 총폐기 금액</span>
                    <span class="pending-count" id="todayDisposalAmount">0원</span>
                </div>
            </div>

            <section class="card disposal-card disposal-search-card mb-3">
                <div class="card-body px-3 py-2">
                    <!-- 검색 조건은 별도 JavaScript에서 각 입력 요소의 id로 수집 -->
                    <div class="search-filters">
                        <div class="search-field">
                            <label class="filter-label" for="storeName">직영점</label>
                            <input id="storeName" class="form-control form-control-sm" type="text"
                                   placeholder="직영점을 입력하세요" th:value="${filter != null ? filter.storeName : null}">
                        </div>
                        <div class="search-field">
                            <label class="filter-label" for="ingredientName">식재료명</label>
                            <input id="ingredientName" class="form-control form-control-sm"
                                   type="text" placeholder="식재료명을 입력하세요"
                                   th:value="${filter != null ? filter.ingredientName : null}">
                        </div>
                        <div class="search-field">
                            <label class="filter-label" for="status">처리 상태</label>
                            <select id="status" class="form-select form-select-sm">
                                <option value="">전체</option>
                                <option value="요청"
                                        th:selected="${filter != null and filter.disposalStatus == 'REQUESTED'}">요청
                                </option>
                                <option value="승인"
                                        th:selected="${filter != null and filter.disposalStatus == 'APPROVED'}">승인
                                </option>
                                <option value="거절"
                                        th:selected="${filter != null and filter.disposalStatus == 'REJECTED'}">거절
                                </option>
                                <option value="완료"
                                        th:selected="${filter != null and filter.disposalStatus == 'COMPLETED'}">완료
                                </option>
                            </select>
                        </div>

                        <div class="request-period-column">
                            <label class="filter-label" for="startDate">요청기간</label>
                            <div class="request-period-controls">
                                <div class="request-period-dates">
                                    <input id="startDate" class="form-control form-control-sm"
                                           type="date" aria-label="요청기간 시작일"
                                           th:value="${filter != null ? filter.startDate : null}">
                                    <span aria-hidden="true">~</span>
                                    <input id="endDate" class="form-control form-control-sm"
                                           type="date" aria-label="요청기간 종료일"
                                           th:value="${filter != null ? filter.endDate : null}">
                                </div>
                                <button type="button" class="btn btn-outline-secondary request-period-toggle"
                                        data-bs-toggle="collapse" data-bs-target="#advancedFilters"
                                        aria-expanded="false" aria-controls="advancedFilters"
                                        aria-label="상세 검색 조건">
                                    <span class="collapse-plus" aria-hidden="true">+</span>
                                    <span class="collapse-minus" aria-hidden="true">−</span>
                                </button>
                            </div>
                        </div>
                        <div class="search-actions">
                            <button type="button" id="disposalResetBtn" class="btn btn-outline-secondary btn-sm px-3">
                                초기화
                            </button>
                            <button type="button" id="disposalSearchBtn" class="btn btn-primary btn-sm px-4">검색</button>
                        </div>
                    </div>
                    <div class="collapse mt-2" id="advancedFilters">
                        <div class="advanced-panel">
                            <div class="row g-2">
                                <div class="col-12 col-md-6 col-xl-3">
                                    <label class="filter-label" for="disposalType">폐기 유형</label>
                                    <select id="disposalType" class="form-select form-select-sm">
                                        <option value="">전체</option>
                                        <option th:each="type : ${disposalTypeList}"
                                                th:value="${type}"
                                                th:text="${type}"
                                                th:selected="${filter != null and filter.disposalType == type}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6 col-xl-3">
                                    <label class="filter-label" for="disposalTiming">폐기 시기</label>
                                    <select id="disposalTiming" class="form-select form-select-sm">
                                        <option value="">전체</option>
                                        <option value="정기폐기">정기폐기</option>
                                        <option value="수시폐기">수시폐기</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div id="disposalResults" aria-live="polite">
                <section class="card disposal-card disposal-list-card">
                    <div class="card-body p-3 p-lg-4">
                        <div class="d-flex flex-wrap justify-content-between align-items-center list-toolbar mb-3">
                            <div class="d-flex align-items-center gap-2">
                                <h5 class="section-heading">폐기 목록</h5>
                                <span class="small text-secondary">총 <strong id="disposalTotalCount" class="text-dark"
                                                                             th:text="${#numbers.formatInteger(list.total, 1, 'COMMA')}">0</strong>건</span>
                            </div>
                            <div class="d-flex flex-wrap align-items-center gap-2">
                                <label for="requestedAtSort" class="small text-secondary mb-0">요청일시</label>
                                <select id="requestedAtSort"
                                        class="form-select form-select-sm w-auto me-2">
                                    <option value="desc"
                                            th:selected="${filter == null or filter.sortType == null or filter.sortType == 'desc'}">
                                        최신순
                                    </option>
                                    <option value="asc" th:selected="${filter != null and filter.sortType == 'asc'}">
                                        오래된순
                                    </option>
                                </select>
                                <label for="pageSize" class="small text-secondary mb-0">몇 개씩 보기</label>
                                <select id="pageSize" class="form-select form-select-sm page-size-select"
                                        aria-label="페이지당 표시 건수">
                                    <option value="5">5개</option>
                                    <option value="10">10개</option>
                                    <option value="15">15개</option>
                                </select>
                            </div>
                        </div>
                        <div class="disposal-table-scroll" style="overflow-x: auto; overflow-y: auto;"
                             aria-label="폐기 목록 스크롤 영역">
                            <table class="table table-sm table-hover align-middle mb-0 text-nowrap"
                                   style="table-layout: auto !important; width: 100%; min-width: 1100px;">
                                <thead>
                                <tr>
                                    <th id="requestedAtHeader" scope="col" aria-sort="descending">요청일시</th>
                                    <th>직영점</th>
                                    <th>식재료명</th>
                                    <th>폐기수량</th>
                                    <th class="text-end">폐기비용</th>
                                    <th>폐기 유형</th>
                                    <th>처리 방식</th>
                                    <th>처리 상태</th>
                                    <th>처리 일시</th>
                                    <th class="text-center">상세</th>
                                </tr>
                                </thead>
                                <tbody id="disposalListRows">
                                <tr th:each="item : ${list.list}">
                                    <td class="nowrap" style="white-space:nowrap !important;word-break:keep-all;"
                                        th:text="${item.disposalReqAt != null ? #dates.format(item.disposalReqAt, 'yyyy-MM-dd HH:mm:ss') : '—'}">
                                        —
                                    </td>
                                    <td th:text="${item.storeName}">—</td>
                                    <td class="fw-semibold" th:text="${item.ingredientName}">—</td>
                                    <td class="nowrap"
                                        th:text="${#numbers.formatInteger(item.disposalQuantity, 1, 'COMMA')}">0
                                    </td>
                                    <td class="cost-cell"
                                        th:text="|${#numbers.formatInteger(item.disposalPrice, 1, 'COMMA')}원|">0원
                                    </td>
                                    <td th:text="${item.disposalType}">—</td>
                                    <td th:text="${item.processingMethod}">—</td>
                                    <td>
                                        <span class="status"
                                              th:classappend="${item.disposalStatus == '승인' ? 'status-approved' :
                                                            (item.disposalStatus == '거절' ? 'status-rejected' :
                                                            (item.disposalStatus == '완료' ? 'status-completed' :
                                                            'status-pending'))}"
                                              th:text="${item.disposalStatus != null ? item.disposalStatus : '—'}">요청</span>
                                    </td>
                                    <td class="nowrap" style="white-space:nowrap !important;word-break:keep-all;"
                                        th:text="${item.checkAt != null ? #dates.format(item.checkAt, 'yyyy-MM-dd HH:mm:ss') : '—'}">
                                        —
                                    </td>
                                    <td class="text-center">
                                        <button type="button"
                                                class="btn btn-outline-primary btn-sm py-0 px-2 nowrap disposal-detail-btn"
                                                th:data-disposal-id="${item.disposalId}">상세
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(list.list)}">
                                    <td colspan="10" class="text-center text-secondary py-4">조회된 폐기 내역이 없습니다.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 하단 조회 결과 및 페이지네이션 공통 영역 -->
                        <div id="disposalPaginationArea">

                            <!-- 조회 범위 및 전체 검색 건수 영역 -->
                            <p id="disposalListFooter"
                               class="text-center small text-secondary mt-2 mb-0 list-footer"
                               th:text="${list.total == 0 ? '총 0건' :
           (#numbers.formatInteger(list.startRow, 1, 'COMMA')
           + '–'
           + #numbers.formatInteger(list.endRow, 1, 'COMMA')
           + ' / 총 '
           + #numbers.formatInteger(list.total, 1, 'COMMA')
           + '건')}">
                                총 0건
                            </p>

                            <!-- 페이지네이션 버튼 영역 -->
                            <div id="disposalPagination"
                                 class="pagination-center"
                                 th:with="
            blockSize=${list.pageSize},
            startPage=${((list.pageNum - 1) / blockSize) * blockSize + 1},
            endPage=${startPage + blockSize - 1 > list.pages
                       ? list.pages
                       : startPage + blockSize - 1}">

                                <nav aria-label="폐기 목록 페이지">
                                    <ul class="pagination pagination-sm mb-0 justify-content-center">

                                        <!-- 이전 페이지 블록 -->
                                        <li class="page-item"
                                            th:classappend="${startPage <= 1 ? 'disabled' : ''}">

                                            <button id="prevPageBtn"
                                                    type="button"
                                                    class="page-link"
                                                    th:data-page="${startPage - 5}"
                                                    th:disabled="${startPage <= 1}">
                                                이전
                                            </button>

                                        </li>

                                        <!-- 숫자 버튼 5개 고정 생성 -->
                                        <li class="page-item"
                                            th:each="index : ${#numbers.sequence(1, 5)}"
                                            th:with="pageNumber=${startPage + index - 1}"
                                            th:hidden="${pageNumber > list.pages}"
                                            th:classappend="${pageNumber == list.pageNum ? 'active' : ''}">

                                            <button type="button"
                                                    class="page-link page-number-btn"
                                                    th:data-page="${pageNumber}"
                                                    th:text="${pageNumber}">
                                                1
                                            </button>

                                        </li>

                                        <!-- 다음 페이지 블록 -->
                                        <li class="page-item"
                                            th:classappend="${endPage >= list.pages ? 'disabled' : ''}">

                                            <button id="nextPageBtn"
                                                    type="button"
                                                    class="page-link"
                                                    th:data-page="${endPage + 1}"
                                                    th:disabled="${endPage >= list.pages}">
                                                다음
                                            </button>

                                        </li>

                                    </ul>
                                </nav>
                            </div>

                        </div>


                    </div> <!-- card-body -->
                </section> <!-- disposal-list-card -->
            </div> <!-- disposalResults -->
        </div> <!-- disposal-content -->
    </main>
</div>


<div th:replace="~{fragment/disposal-modal :: disposalModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/hqDisposal.js"></script>
<script src="/js/disposalModal.js"></script>
</body>
</html>
