<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>폐기 등록 (본사) | FoodIngredientManagement</title>
    <!-- IntelliJ 내장 서버 미리보기 및 Spring Boot 실행: Bootstrap CDN (인터넷 연결 필요) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 모든 환경에서 동일한 상대경로 CSS 사용 -->
    <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  </head>
  <body>
    <div class="hq-layout d-flex">
      <!-- 공통 사이드바: 상대경로 iframe. Spring Boot/IntelliJ HTTP/file://에서 동일 -->
      <iframe class="hq-sidebar-frame" src="../../static/fragments/sidebar.html" th:src="@{/fragments/sidebar.html}" title="공통 메뉴" loading="eager"></iframe>
      <main class="hq-main">
        <!-- 공통 상단 헤더 -->
        <header class="hq-header d-flex align-items-center px-4 fw-bold">식재료 · 재고 · 폐기 운영 관리</header>
        <div class="hq-content p-4">
          <!-- 페이지 제목 및 사용자 구분 -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="hq-page-title mb-0">폐기 등록 (본사)</h4>
            <span class="badge text-bg-light border">본사</span>
          </div>
          <!-- 폐기 대상 및 로트 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">폐기 대상 및 로트</h6>
            <div class="row g-3">
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">입고일련번호</div>
                <div class="fw-semibold">202611060001</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">식재료</div>
                <div class="fw-semibold">식빵</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">지점</div>
                <div class="fw-semibold">서울 한국대점</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">재고 기준단위</div>
                <div class="fw-semibold">개</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">입고단위</div>
                <div class="fw-semibold">박스</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">현재 재고</div>
                <div class="fw-semibold">140개</div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="small text-secondary">소비기한</div>
                <div class="fw-semibold">2026-11-10</div>
              </div>
            </div>
          </section>
          <!-- 폐기 요청 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">폐기 요청</h6>
            <div class="row g-3">
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">폐기요청일시</label>
                <input class="form-control form-control-sm" type="datetime-local" placeholder="" value="2026-11-06T10:10">
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">폐기수량</label>
                <input class="form-control form-control-sm" type="number" placeholder="" value="100">
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">폐기단위</label>
                <select class="form-select form-select-sm">
                  <option selected="">개</option>
                </select>
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">폐기유형</label>
                <select class="form-select form-select-sm">
                  <option selected="">소비기한 경과</option>
                  <option>포장 파손</option>
                  <option>손상</option>
                  <option>품질불량</option>
                  <option>조리실수</option>
                  <option>주문취소</option>
                  <option>기타</option>
                </select>
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">처리방식</label>
                <select class="form-select form-select-sm">
                  <option selected="">승인 요청</option>
                  <option>즉시 처리(정책 검토)</option>
                </select>
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold">요청자</label>
                <div>본사 관리자</div>
              </div>
            </div>
            <label class="form-label small mt-3">상세 사유</label>
            <textarea class="form-control" rows="3">포장이 찢어져 식빵 100개 폐기를 요청합니다.</textarea>
            <div class="d-flex justify-content-end flex-wrap gap-2 mt-3">
              <button type="button" class="btn btn-primary btn-sm" disabled="">등록</button>
              <a class="btn btn-outline-primary btn-sm text-nowrap" href="hqDisposalList.html">목록</a>
            </div>
          </section>
          <!-- 화면에 표시한 자료는 DB 연결 전 고정 예시 데이터 -->
          <p class="small text-secondary mt-3">현재는 UI 스켈레톤입니다. 조회·저장·승인·재고 차감은 실제 처리하지 않습니다.</p>
        </div>
      </main>
    </div>
    <!-- 기존 Bootstrap 보조 JS: 사이드바는 iframe으로 공유 -->
    <script src="../../static/js/layout.js" th:src="@{/js/layout.js}"></script>
  </body>
</html>
