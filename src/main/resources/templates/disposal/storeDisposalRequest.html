<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
      폐기 등록 (직영점)
    </title>
    <!-- 브라우저로 확인을 위한 로컬 링크 -->
    <link href="../../static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}"/>
    <!-- 배포 후 프로젝트 실행하는 링크 -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"> -->
    <!-- 기존 common.css는 수정하지 않고 그대로 사용 -->
    <link href="../../static/css/common.css" rel="stylesheet" th:href="@{/css/common.css}"/>
  </head>
  <body>
    <div class="hq-layout d-flex">

      <!-- 공통 사이드바: 기존 sidebar.html을 한 번만 불러온다. -->
      <div id="sidebar-container"></div>
      <main class="hq-main">
        <header class="hq-header d-flex align-items-center px-4 fw-bold">
          식재료 · 재고 · 폐기 운영 관리
        </header>
        <div class="hq-content p-4">
          <!-- 페이지 제목 및 이동 메뉴 -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="hq-page-title mb-0">
              폐기 등록 (직영점)
            </h4>
            <a class="btn btn-outline-secondary" href="storeDisposalList.html" th:href="@{/store/disposal/list}">
              폐기 조회
            </a>
          </div>
          <!-- 폐기 정보 입력: 입력 UI만 작성. 저장 기능은 담당자가 연결 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">
              폐기 정보 입력
            </h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  폐기 장소
                </label>
                <input class="form-control" placeholder="" readonly="" type="text" value="서울 한국대점"/>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  식재료명
                </label>
                <select class="form-select">
                  <option>
                    식재료 선택
                  </option>
                  <option>
                    양배추
                  </option>
                  <option>
                    식빵
                  </option>
                  <option>
                    치즈
                  </option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  재고번호
                </label>
                <select class="form-select">
                  <option>
                    재고 선택
                  </option>
                  <option>
                    INV-101
                  </option>
                  <option>
                    INV-102
                  </option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  폐기수량
                </label>
                <input class="form-control" min="1" placeholder="" type="number" value="1"/>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  폐기유형
                </label>
                <select class="form-select">
                  <option>
                    사용기한 경과
                  </option>
                  <option>
                    파손/오염
                  </option>
                  <option>
                    품질 이상
                  </option>
                  <option>
                    식재료규칙
                  </option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  처리방식
                </label>
                <select class="form-select">
                  <option>
                    즉시 폐기
                  </option>
                  <option>
                    현장 폐기
                  </option>
                  <option>
                    반품 처리
                  </option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  폐기일자
                </label>
                <input class="form-control" placeholder="" type="date"/>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  등록 담당자
                </label>
                <input class="form-control" placeholder="담당자명" type="text"/>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">
                  폐기 상세사유
                </label>
                <textarea class="form-control" placeholder="폐기 사유 입력" rows="3"></textarea>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">
                  증빙사진 (선택)
                </label>
                <input class="form-control" placeholder="" type="file"/>
              </div>
            </div>
          </section>
          <!-- 입력 폼 버튼: 저장 기능을 구현하기 전까지 비활성화 -->
          <div class="d-flex justify-content-end gap-2 mb-3">
            <a class="btn btn-outline-secondary" href="storeDisposalList.html" th:href="@{/store/disposal/list}">
              취소
            </a>
            <button class="btn btn-primary" disabled="" type="button">
              폐기 등록
            </button>
          </div>
          <!-- 하드코딩 예시 화면. 추후 담당자가 MyBatis 연동 기능 구현 -->
          <p class="text-secondary small mt-3">
            현재 표시된 데이터는 화면 확인용 예시입니다. 조회·등록·수정·삭제 기능은 연결되지 않았습니다.
          </p>
        </div>
      </main>
    </div>
  <!-- IntelliJ 미리보기는 sidebar-local.js, Spring Boot는 기존 layout.js 사용 -->
  <script src="../../static/js/sidebar-local.js" th:src="@{/js/layout.js}"></script>

  </body>
</html>
