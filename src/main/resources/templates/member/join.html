<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | 그린매니저</title>

    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/join.css}">
</head>

<body>

<div class="auth-wrapper">
    <div class="card auth-card p-4 p-md-5">

        <div class="text-center mb-4">
            <h2 class="auth-logo mb-2">그린매니저</h2>
            <h5 class="fw-bold">회원가입</h5>
            <p class="auth-subtitle mb-0">
                식자재 관리 시스템 계정을 생성합니다.
            </p>
        </div>

        <form th:action="@{/join}" method="post">

            <div class="mb-3">
                <label for="id" class="form-label fw-semibold">아이디</label>
                <input type="text"
                       class="form-control"
                       id="id"
                       name="id"
                       placeholder="사용할 아이디를 입력하세요"
                       required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">비밀번호</label>
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="비밀번호를 입력하세요"
                       required>
            </div>

            <div class="mb-3">
                <label for="passwordConfirm" class="form-label fw-semibold">
                    비밀번호 확인
                </label>
                <input type="password"
                       class="form-control"
                       id="passwordConfirm"
                       name="passwordConfirm"
                       placeholder="비밀번호를 다시 입력하세요"
                       required>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">이름</label>
                <input type="text"
                       class="form-control"
                       id="name"
                       name="name"
                       placeholder="이름을 입력하세요"
                       required>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label fw-semibold">이메일</label>
                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="이메일을 입력하세요"
                       required>
            </div>

            <div th:if="${param.error}"
                 class="alert alert-danger py-2 small">
                이미 사용 중인 아이디이거나 회원가입에 실패했습니다.
            </div>

            <button type="submit" class="btn btn-auth w-100">
                가입하기
            </button>

        </form>

        <div class="text-center mt-4">
            <span class="text-secondary small">이미 계정이 있으신가요?</span>
            <a th:href="@{/loginView}"
               class="text-primary text-decoration-none fw-semibold ms-1">
                로그인
            </a>
        </div>

    </div>
</div>

<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>

</body>
</html>
