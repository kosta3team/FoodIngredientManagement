<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>발주조회(직영점) | FoodIngredientManagement</title>
    <!-- IntelliJ 내장 서버 미리보기 및 Spring Boot 실행: Bootstrap CDN (인터넷 연결 필요) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 모든 환경에서 동일한 상대경로 CSS 사용 -->
    <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
  </head>
  <body>
    <div class="hq-layout d-flex">
      <!-- 공통 사이드바: 상대경로 iframe. Spring Boot/IntelliJ HTTP/file://에서 동일 -->
      <iframe class="hq-sidebar-frame" src="../../static/fragments/sidebar.html" th:src="@{/fragments/sidebar.html}" title="공통 메뉴" loading="eager"></iframe>
      <main class="hq-main">
        <!-- 공통 상단 헤더 -->
        <header class="hq-header d-flex align-items-center px-4 fw-bold">식재료 · 재고 · 폐기 운영 관리</header>
        <div class="hq-content p-4">
          <!-- 페이지 제목 및 사용자 구분 -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="hq-page-title mb-0">발주조회(직영점)</h4>
            <span class="badge text-bg-light border">직영점</span>
          </div>
          <!-- 지점: 서울 한국대점 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">지점: 서울 한국대점</h6>
            <section class="card hq-card p-3 mb-3">
              <h6 class="fw-bold mb-3">조회 조건</h6>
              <div class="row g-2 align-items-end">
                <div class="col-12 col-md-3">
                  <label class="form-label small fw-semibold">일시구분</label>
                  <select class="form-select form-select-sm">
                    <option selected="">전체</option>
                    <option>발주일시</option>
                    <option>입고일시</option>
                  </select>
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label small fw-semibold">시작일</label>
                  <input class="form-control form-control-sm" type="date" placeholder="" value="2026-11-01">
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label small fw-semibold">종료일</label>
                  <input class="form-control form-control-sm" type="date" placeholder="" value="2026-11-30">
                </div>
                <div class="col-12 col-md-3">
                  <label class="form-label small fw-semibold">발주상태</label>
                  <select class="form-select form-select-sm">
                    <option selected="">전체</option>
                    <option>대기</option>
                    <option>승인</option>
                    <option>거절</option>
                  </select>
                </div>
                <div class="col-12 col-md-auto">
                  <button type="button" class="btn btn-primary btn-sm" disabled="">검색</button>
                </div>
              </div>
            </section>
            <div class="d-flex justify-content-end mt-2">
              <a
                class="btn btn-outline-primary btn-sm text-nowrap"
                href="orderRequest.html"
              >
                발주 요청
              </a>
            </div>
          </section>
          <!-- 발주 요청 목록 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">발주목록</h6>
            <div class="table-responsive">
              <table class="table table-hover align-middle hq-table table-sm mb-0">
                <!-- 테이블 항목 -->
                <thead>
                  <tr>
                    <th scope="col">순번</th>
                    <th scope="col">발주일시</th>
                    <th scope="col">발주요약</th>
                    <th scope="col">총금액</th>
                    <th scope="col">상태</th>
                    <th scope="col">입고일시</th>
                    <th scope="col">상세</th>
                  </tr>
                </thead>
                <!-- 목록 예시 데이터 (DB 연동 전) -->
                <tbody>
                  <tr>
                    <td>1</td>
                    <td>2026-11-03 11:00</td>
                    <td>식빵 외 2건</td>
                    <td>140,000원</td>
                    <td>
                      <span class="badge text-bg-success">승인</span>
                    </td>
                    <td>2026-11-03 14:00</td>
                    <td>
                      <a
                        class="btn btn-outline-primary btn-sm text-nowrap"
                        href="orderDetail.html"
                      >
                        상세
                      </a>
                    </td>
                  </tr>
                  <tr>
                    <td>2</td>
                    <td>2026-11-06 09:10</td>
                    <td>토마토소스 외 4건</td>
                    <td>39,000원</td>
                    <td>
                      <span class="badge text-bg-warning">대기</span>
                    </td>
                    <td>—</td>
                    <td>
                      <a
                        class="btn btn-outline-primary btn-sm text-nowrap"
                        href="orderDetail.html"
                      >
                        상세
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <!-- 기존 Bootstrap 보조 JS: 사이드바는 iframe으로 공유 -->
    <script src="../../static/js/layout.js" th:src="@{/js/layout.js}"></script>
  </body>
</html>
