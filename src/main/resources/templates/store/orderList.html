<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
      발주요청 조회 (직영점)
    </title>
    <!-- 브라우저로 확인을 위한 로컬 링크 -->
    <link href="../../static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}"/>
    <!-- 배포 후 프로젝트 실행하는 링크 -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"> -->
    <!-- 기존 common.css는 수정하지 않고 그대로 사용 -->
    <link href="../../static/css/common.css" rel="stylesheet" th:href="@{/css/common.css}"/>
  </head>
  <body>
    <div class="hq-layout d-flex">

      <!-- 공통 사이드바: 기존 sidebar.html을 한 번만 불러온다. -->
      <div id="sidebar-container"></div>
      <main class="hq-main">
        <header class="hq-header d-flex align-items-center px-4 fw-bold">
          식재료 · 재고 · 폐기 운영 관리
        </header>
        <div class="hq-content p-4">
          <!-- 페이지 제목 및 이동 메뉴 -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="hq-page-title mb-0">
              발주요청 조회 (직영점)
            </h4>
            <a class="btn btn-primary" href="orderRequest.html" th:href="@{/store/orders/request}">
              새 발주 요청
            </a>
          </div>
          <!-- 검색 조건: 화면 구성만 제공하며 데이터는 예시 값 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">
              검색 조건
            </h6>
            <div class="row g-2 align-items-end">
              <div class="col-md-3">
                <label class="form-label">
                  검색
                </label>
                <input class="form-control" placeholder="발주일시 또는 품목명" type="text"/>
              </div>
              <div class="col-md-3">
                <label class="form-label">
                  처리 상태
                </label>
                <select class="form-select">
                  <option>
                    전체 상태
                  </option>
                  <option>
                    대기
                  </option>
                  <option>
                    승인
                  </option>
                  <option>
                    거절
                  </option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">
                  시작일
                </label>
                <input class="form-control" placeholder="" type="date"/>
              </div>
              <div class="col-md-3">
                <label class="form-label">
                  종료일
                </label>
                <input class="form-control" placeholder="" type="date"/>
              </div>
              <div class="col-md-auto">
                <button class="btn btn-primary" disabled="" type="button">
                  검색
                </button>
              </div>
            </div>
            <p class="text-secondary small mt-2 mb-0">
              검색 기능은 DB 연동 후 구현합니다.
            </p>
          </section>
          <!-- 발주요청 목록: 화면 구성만 제공하며 데이터는 예시 값 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">
              발주요청 목록
            </h6>
            <div class="table-responsive">
              <table class="table table-hover align-middle hq-table mb-0">
                <thead>
                  <tr>
                    <th scope="col">
                      순번
                    </th>
                    <th scope="col">
                      발주일시
                    </th>
                    <th scope="col">
                      주문요약
                    </th>
                    <th scope="col">
                      총 발주금액
                    </th>
                    <th scope="col">
                      처리 상태
                    </th>
                    <th scope="col">
                      상세보기
                    </th>
                    <th scope="col">
                      수정
                    </th>
                    <th scope="col">
                      삭제
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      1
                    </td>
                    <td>
                      2026-11-03 10:30
                    </td>
                    <td>
                      양배추 외 1종
                    </td>
                    <td>
                      27,000원
                    </td>
                    <td>
                      대기
                    </td>
                    <td>
                      <a class="btn btn-outline-primary btn-sm" href="orderDetail.html" th:href="@{/store/orders/detail/ORD-001}">
                        상세 보기
                      </a>
                    </td>
                    <td>
                      <a class="btn btn-outline-secondary btn-sm" href="orderRequest.html" th:href="@{/store/orders/request}">
                        수정 화면
                      </a>
                    </td>
                    <td>
                      <button class="btn btn-outline-danger btn-sm" disabled="" type="button">
                        삭제
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      2
                    </td>
                    <td>
                      2026-11-03 10:30
                    </td>
                    <td>
                      식빵 외 1종
                    </td>
                    <td>
                      14,000원
                    </td>
                    <td>
                      승인
                    </td>
                    <td>
                      <a class="btn btn-outline-primary btn-sm" href="orderDetail.html" th:href="@{/store/orders/detail/ORD-001}">
                        상세 보기
                      </a>
                    </td>
                    <td>
                      <a class="btn btn-outline-secondary btn-sm" href="orderRequest.html" th:href="@{/store/orders/request}">
                        수정 화면
                      </a>
                    </td>
                    <td>
                      <button class="btn btn-outline-danger btn-sm" disabled="" type="button">
                        삭제
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
          <!-- 하드코딩 예시 화면. 추후 담당자가 MyBatis 연동 기능 구현 -->
          <p class="text-secondary small mt-3">
            현재 표시된 데이터는 화면 확인용 예시입니다. 조회·등록·수정·삭제 기능은 연결되지 않았습니다.
          </p>
        </div>
      </main>
    </div>
  <!-- IntelliJ 미리보기는 sidebar-local.js, Spring Boot는 기존 layout.js 사용 -->
  <script src="../../static/js/sidebar-local.js" th:src="@{/js/layout.js}"></script>

  </body>
</html>
