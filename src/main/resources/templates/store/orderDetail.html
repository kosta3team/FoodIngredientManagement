<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
      발주 상세 (직영점)
    </title>
    <!-- 브라우저로 확인을 위한 로컬 링크 -->
    <link href="../../static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}"/>
    <!-- 배포 후 프로젝트 실행하는 링크 -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"> -->
    <!-- 기존 common.css는 수정하지 않고 그대로 사용 -->
    <link href="../../static/css/common.css" rel="stylesheet" th:href="@{/css/common.css}"/>
  </head>
  <body>
    <div class="hq-layout d-flex">

      <!-- 공통 사이드바: 기존 sidebar.html을 한 번만 불러온다. -->
      <div id="sidebar-container"></div>
      <main class="hq-main">
        <header class="hq-header d-flex align-items-center px-4 fw-bold">
          식재료 · 재고 · 폐기 운영 관리
        </header>
        <div class="hq-content p-4">
          <!-- 페이지 제목 및 이동 메뉴 -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="hq-page-title mb-0">
              발주 상세 (직영점)
            </h4>
            <a class="btn btn-outline-secondary" href="orderList.html" th:href="@{/store/orders/list}">
              목록으로
            </a>
          </div>
          <!-- 발주 정보: 화면 구성만 제공하며 데이터는 예시 값 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">
              발주 정보
            </h6>
            <dl class="row mb-0">
              <dt class="col-sm-3 text-secondary">
                발주번호
              </dt>
              <dd class="col-sm-9">
                ORD-001
              </dd>
              <dt class="col-sm-3 text-secondary">
                발주일시
              </dt>
              <dd class="col-sm-9">
                2026-11-03 10:30
              </dd>
              <dt class="col-sm-3 text-secondary">
                요청 지점
              </dt>
              <dd class="col-sm-9">
                서울 한국대점
              </dd>
              <dt class="col-sm-3 text-secondary">
                처리 상태
              </dt>
              <dd class="col-sm-9">
                대기
              </dd>
              <dt class="col-sm-3 text-secondary">
                총 발주금액
              </dt>
              <dd class="col-sm-9">
                27,000원
              </dd>
            </dl>
          </section>
          <!-- 품목 내역: 화면 구성만 제공하며 데이터는 예시 값 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">
              품목 내역
            </h6>
            <div class="table-responsive">
              <table class="table table-hover align-middle hq-table mb-0">
                <thead>
                  <tr>
                    <th scope="col">
                      순번
                    </th>
                    <th scope="col">
                      코드
                    </th>
                    <th scope="col">
                      식재료명
                    </th>
                    <th scope="col">
                      수량
                    </th>
                    <th scope="col">
                      단가(원)
                    </th>
                    <th scope="col">
                      금액(원)
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      1
                    </td>
                    <td>
                      0006
                    </td>
                    <td>
                      양배추
                    </td>
                    <td>
                      5
                    </td>
                    <td>
                      5,000
                    </td>
                    <td>
                      25,000
                    </td>
                  </tr>
                  <tr>
                    <td>
                      2
                    </td>
                    <td>
                      0001
                    </td>
                    <td>
                      식빵
                    </td>
                    <td>
                      1
                    </td>
                    <td>
                      2,000
                    </td>
                    <td>
                      2,000
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
          <!-- 하드코딩 예시 화면. 추후 담당자가 MyBatis 연동 기능 구현 -->
          <p class="text-secondary small mt-3">
            현재 표시된 데이터는 화면 확인용 예시입니다. 조회·등록·수정·삭제 기능은 연결되지 않았습니다.
          </p>
        </div>
      </main>
    </div>
  <!-- IntelliJ 미리보기는 sidebar-local.js, Spring Boot는 기존 layout.js 사용 -->
  <script src="../../static/js/sidebar-local.js" th:src="@{/js/layout.js}"></script>

  </body>
</html>
