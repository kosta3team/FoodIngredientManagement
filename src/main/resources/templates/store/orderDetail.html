<!-- AJAX 상세 조회 조각: 버튼의 예시 데이터를 drawer.js가 채운다. -->
<div class="bg-light rounded p-3 mb-3">
    <div class="row g-2">
        <div class="col-12"><strong>발주번호:</strong> <span data-detail-field="number">-</span></div>
        <div class="col-12"><strong>요청 지점:</strong> <span data-detail-field="location">-</span></div>
        <div class="col-12"><strong>발주일시:</strong> <span data-detail-field="datetime">-</span></div>
        <div class="col-12"><strong>상태:</strong> <span data-detail-field="status">-</span></div>

</div>
