<!-- 직영점 발주 요청 화면 -->

<div class="d-flex justify-content-between flex-wrap gap-2 align-items-center mb-3">

    <span class="badge text-bg-primary fs-6">
        지점: 서울 한국대점
    </span>

</div>


<!-- 발주 요청 폼 -->
<form id="orderRequestForm">

    <!-- 발주 품목 작성 -->
    <div class="card hq-card p-3 mb-3">

        <h6 class="fw-bold mb-3">발주 품목 작성</h6>

        <div class="table-responsive">

            <table class="table align-middle hq-table mb-0">

                <thead>
                <tr>
                    <th>순번</th>
                    <th>품목선택</th>
                    <th>발주수량</th>
                    <th>단가</th>
                    <th>합계금액</th>
                    <th>삭제</th>
                </tr>
                </thead>

                <tbody id="itemTbody">
                </tbody>

            </table>

        </div>

        <!-- 품목 추가 -->
        <div class="text-center mt-3">

            <button class="btn btn-outline-primary"
                    onclick="addOrderRow()"
                    type="button">

                + 품목 추가

            </button>

        </div>

    </div>


    <!-- 발주 요청 금액 및 제출 -->
    <div class="card hq-card p-3">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">

            <!-- 선택 품목 수 -->
            <div class="text-secondary">

                선택된 품목:

                <strong id="itemCount">0</strong>개

            </div>


            <!-- 총 발주 금액 및 요청 버튼 -->
            <div class="d-flex align-items-center gap-3 flex-wrap">

                <div class="fs-5">

                    총 발주금액:

                    <strong class="text-primary" id="grandTotal">0</strong>원

                </div>

                <button class="btn btn-primary"
                        id="submitOrderButton"
                        type="submit">

                    발주 요청 완료

                </button>

            </div>

        </div>

    </div>

</form>


<!-- 발주 품목 행 템플릿 -->
<template id="orderRowTemplate">

    <tr>

        <!-- 순번 -->
        <td class="row-seq text-center">
            1
        </td>


        <!-- 품목 선택 -->
        <td>

            <select class="form-select item-select" required>

                <option data-price="0" value="">
                    -- 품목 선택 --
                </option>

                <option data-price="14000" value="0028">
                    설탕 (14,000원)
                </option>

                <option data-price="13000" value="0021">
                    소금 (13,000원)
                </option>

                <option data-price="2500" value="0011">
                    슬라이스치즈 (2,500원)
                </option>

                <option data-price="5000" value="0006">
                    양배추 (5,000원)
                </option>

                <option data-price="2000" value="0001">
                    식빵 (2,000원)
                </option>

            </select>

        </td>


        <!-- 발주 수량 -->
        <td>

            <input class="form-control item-qty"
                   type="number"
                   min="1"
                   step="1"
                   value="1"
                   required>

        </td>


        <!-- 단가 -->
        <td class="item-unit">
            0원
        </td>


        <!-- 합계 금액 -->
        <td class="item-total fw-bold">
            0원
        </td>


        <!-- 삭제 -->
        <td>

            <button class="btn btn-outline-danger btn-sm"
                    onclick="removeOrderRow(this)"
                    type="button">

                삭제

            </button>

        </td>

    </tr>

</template>
