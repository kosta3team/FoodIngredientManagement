<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>직영점 - 발주 요청</title>
<link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet"/>
<!-- 기존 공통 CSS는 그대로 두고, Bootstrap 파일만 로컬로 불러온다. -->
<link href="/css/common.css" rel="stylesheet"/>
</head>
<body>
<div class="hq-layout d-flex">
<!-- 기존 sidebar.html을 한 번만 AJAX 로드하여 모든 화면에서 재사용한다. -->
<div id="sidebar-container"></div>
<main class="hq-main">
<header class="hq-header d-flex align-items-center px-4 fw-bold">식재료 · 재고 · 폐기 운영 관리</header>
<!-- 화면 본문: 카드와 표는 common.css 및 Bootstrap 클래스만 사용한다. -->
<div class="hq-content p-4">
<div class="d-flex justify-content-between flex-wrap gap-2 align-items-center mb-3"><h4 class="hq-page-title mb-0"><span id="requestTitle">발주 요청 (직영점)</span></h4><span class="badge text-bg-primary fs-6">지점: 서울 한국대점</span></div>
<form id="orderRequestForm">
<div class="card hq-card p-3 mb-3"><h6 class="fw-bold mb-3">발주 품목 작성</h6><div class="table-responsive"><table class="table align-middle hq-table mb-0"><thead><tr><th>순번</th><th>품목선택</th><th>발주수량</th><th>단가</th><th>합계금액</th><th>삭제</th></tr></thead><tbody id="itemTbody"></tbody></table></div><div class="text-center mt-3"><button class="btn btn-outline-primary" onclick="addOrderRow()" type="button">+ 품목 추가</button></div></div>
<div class="card hq-card p-3"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3"><div class="text-secondary">선택된 품목: <strong id="itemCount">0</strong>개</div><div class="d-flex align-items-center gap-3 flex-wrap"><div class="fs-5">총 발주금액: <strong class="text-primary" id="grandTotal">0</strong>원</div><button class="btn btn-primary" id="submitOrderButton" type="submit">발주 요청 완료</button></div></div></div>
</form>
<!-- 품목 행 HTML을 한 곳에서만 유지하기 위해 template을 사용한다. -->
<template id="orderRowTemplate"><tr><td class="row-seq text-center">1</td><td><select class="form-select item-select" required=""><option data-price="0" value="">-- 품목 선택 --</option><option data-price="14000" value="0028">설탕 (14,000원)</option><option data-price="13000" value="0021">소금 (13,000원)</option><option data-price="2500" value="0011">슬라이스치즈 (2,500원)</option><option data-price="5000" value="0006">양배추 (5,000원)</option><option data-price="2000" value="0001">식빵 (2,000원)</option></select></td><td><input class="form-control item-qty" min="1" required="" step="1" type="number" value="1"/></td><td class="item-unit">0원</td><td class="item-total fw-bold">0원</td><td><button class="btn btn-outline-danger btn-sm" onclick="removeOrderRow(this)" type="button">삭제</button></td></tr></template>
</div>
</main>
</div>
<script src="/js/api.js"></script><script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/js/layout.js"></script>

<script src="/js/orderRequest.js"></script>
</body>
</html>
