<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
      발주 요청 (직영점)
    </title>
    <!-- 브라우저로 확인을 위한 로컬 링크 -->
    <link href="../../static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}"/>
    <!-- 배포 후 프로젝트 실행하는 링크 -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"> -->
    <!-- 기존 common.css는 수정하지 않고 그대로 사용 -->
    <link href="../../static/css/common.css" rel="stylesheet" th:href="@{/css/common.css}"/>
  </head>
  <body>
    <div class="hq-layout d-flex">

      <!-- 공통 사이드바: 기존 sidebar.html을 한 번만 불러온다. -->
      <div id="sidebar-container"></div>
      <main class="hq-main">
        <header class="hq-header d-flex align-items-center px-4 fw-bold">
          식재료 · 재고 · 폐기 운영 관리
        </header>
        <div class="hq-content p-4">
          <!-- 페이지 제목 및 이동 메뉴 -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="hq-page-title mb-0">
              발주 요청 (직영점)
            </h4>
            <a class="btn btn-outline-secondary" href="orderList.html" th:href="@{/store/orders/list}">
              발주요청 조회
            </a>
          </div>
          <!-- 발주 품목 작성: 화면 구성만 제공하며 데이터는 예시 값 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">
              발주 품목 작성
            </h6>
            <div class="table-responsive">
              <table class="table table-hover align-middle hq-table mb-0">
                <thead>
                  <tr>
                    <th scope="col">
                      순번
                    </th>
                    <th scope="col">
                      품목선택
                    </th>
                    <th scope="col">
                      발주수량
                    </th>
                    <th scope="col">
                      단가
                    </th>
                    <th scope="col">
                      합계금액
                    </th>
                    <th scope="col">
                      삭제
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      1
                    </td>
                    <td>
                      <select class="form-select">
                        <option>
                          양배추
                        </option>
                        <option>
                          식빵
                        </option>
                        <option>
                          슬라이스치즈
                        </option>
                      </select>
                    </td>
                    <td>
                      <input class="form-control" min="1" placeholder="" type="number" value="5"/>
                    </td>
                    <td>
                      5,000원
                    </td>
                    <td>
                      25,000원
                    </td>
                    <td>
                      <button class="btn btn-outline-danger btn-sm" disabled="" type="button">
                        삭제
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      2
                    </td>
                    <td>
                      <select class="form-select">
                        <option>
                          식빵
                        </option>
                        <option>
                          양배추
                        </option>
                        <option>
                          슬라이스치즈
                        </option>
                      </select>
                    </td>
                    <td>
                      <input class="form-control" min="1" placeholder="" type="number" value="1"/>
                    </td>
                    <td>
                      2,000원
                    </td>
                    <td>
                      2,000원
                    </td>
                    <td>
                      <button class="btn btn-outline-danger btn-sm" disabled="" type="button">
                        삭제
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="text-center mt-3">
              <button class="btn btn-outline-primary" disabled="" type="button">
                + 품목 추가
              </button>
            </div>
          </section>
          <!-- 발주 금액: 화면 구성만 제공하며 데이터는 예시 값 -->
          <section class="card hq-card p-3 mb-3">
            <h6 class="fw-bold mb-3">
              발주 금액
            </h6>
            <div class="d-flex justify-content-between flex-wrap gap-3 align-items-center">
              <span>
                선택된 품목:
                <strong>
                  2
                </strong>
                개
              </span>
              <span class="fs-5">
                총 발주금액:
                <strong class="text-primary">
                  27,000원
                </strong>
              </span>
            </div>
          </section>
          <!-- 입력 폼 버튼: 저장 기능을 구현하기 전까지 비활성화 -->
          <div class="d-flex justify-content-end gap-2 mb-3">
            <a class="btn btn-outline-secondary" href="orderList.html" th:href="@{/store/orders/list}">
              취소
            </a>
            <button class="btn btn-primary" disabled="" type="button">
              발주 요청 완료
            </button>
          </div>
          <!-- 하드코딩 예시 화면. 추후 담당자가 MyBatis 연동 기능 구현 -->
          <p class="text-secondary small mt-3">
            현재 표시된 데이터는 화면 확인용 예시입니다. 조회·등록·수정·삭제 기능은 연결되지 않았습니다.
          </p>
        </div>
      </main>
    </div>
  <!-- IntelliJ 미리보기는 sidebar-local.js, Spring Boot는 기존 layout.js 사용 -->
  <script src="../../static/js/sidebar-local.js" th:src="@{/js/layout.js}"></script>

  </body>
</html>
