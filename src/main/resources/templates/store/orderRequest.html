<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>발주 요청 등록 (직영점) | FoodIngredientManagement</title>
  <!-- 기존 Bootstrap, 공통 CSS 그대로 사용 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
</head>
<body>
<div class="hq-layout d-flex">
  <!-- 기존 sidebar.html 연결: 사이드바 내용 하드코딩하지 않음 -->
  <iframe class="hq-sidebar-frame" src="../../static/fragments/sidebar.html" th:src="@{/fragments/sidebar.html}" title="공통 메뉴" loading="eager"></iframe>

  <main class="hq-main">
    <!-- 공통 헤더 -->
    <header class="hq-header d-flex align-items-center px-4 fw-bold">식재료 · 재고 · 폐기 운영 관리</header>
    <div class="hq-content p-4">

      <!-- 페이지 제목 / 현재 직영점 -->
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h4 class="hq-page-title mb-0">발주요청(직영점)</h4>
        <span class="badge text-bg-light border">지점: 서울 한국대점</span>
      </div>

      <!-- 발주 등록 폼: DB 연결 전 화면 시안 -->
      <form id="orderRequestForm">
        <section class="card hq-card p-3 mb-3">
          <h6 class="fw-bold mb-3">발주 품목 작성</h6>
          <div class="table-responsive">
            <table class="table table-hover align-middle hq-table table-sm mb-0">
              <thead>
              <tr>
                <th scope="col" class="text-center">순번</th>
                <th scope="col">품목선택</th>
                <th scope="col">수량</th>
                <th scope="col">공급가액(단가)</th>
                <th scope="col">주문금액</th>
                <th scope="col">삭제</th>
              </tr>
              </thead>
              <tbody>
              <!-- 처음에는 품목 입력 행 1개만 표시 -->
              <tr>
                <td class="text-center">1</td>
                <td>
                  <select name="ingredient" class="form-select form-select-sm" aria-label="발주 품목 선택" required>
                    <option value="" selected>-- 품목 선택 --</option>
                    <option value="sugar">설탕</option>
                    <option value="salt">소금</option>
                    <option value="cheese">슬라이스치즈</option>
                  </select>
                </td>
                <td>
                  <input name="quantity" type="number" class="form-control form-control-sm" min="1" step="1" value="1" aria-label="발주수량">
                </td>
                <!-- 가격 자동 계산은 JS/API 담당자가 연동할 예정 -->
                <td class="text-nowrap">9,000원</td>
                <td class="text-nowrap fw-semibold">18,000원</td>
                <td><button type="button" class="btn btn-outline-danger btn-sm" disabled>삭제</button></td>
              </tr>
              <tr>
                <td class="text-center">2</td>
                <td>
                  <select name="ingredient" class="form-select form-select-sm" aria-label="발주 품목 선택" required>
                    <option value="" selected>-- 품목 선택 --</option>
                    <option value="sugar">설탕</option>
                    <option value="salt">소금</option>
                    <option value="cheese">슬라이스치즈</option>
                  </select>
                </td>
                <td>
                  <input name="quantity" type="number" class="form-control form-control-sm" min="1" step="1" value="1" aria-label="발주수량">
                </td>
                <!-- 가격 자동 계산은 JS/API 담당자가 연동할 예정 -->
                <td class="text-nowrap">13,000원</td>
                <td class="text-nowrap fw-semibold">26,000원</td>
                <td><button type="button" class="btn btn-outline-danger btn-sm" disabled>삭제</button></td>
              </tr>
              </tbody>
            </table>
          </div>
          <div class="d-flex justify-content-end mt-3">
            <!-- HTML만으로 테이블 행을 동적으로 추가할 수 없으므로 기능 연동 전 비활성화 -->
            <button type="button" class="btn btn-outline-primary btn-sm" disabled>+ 품목 추가</button>
          </div>
        </section>

        <!-- 발주 금액 요약 / 등록 버튼 -->
        <section class="card hq-card p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="text-secondary">선택된 품목: <strong class="text-dark">2</strong>개</span>
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <span class="small">총 발주금액: <strong>44,000</strong>원</span>
              <!-- 저장 API가 없으므로 실제 요청 전송을 하지 않음 -->
              <button type="button" class="btn btn-primary btn-sm" disabled>발주 요청 완료</button>
            </div>
          </div>
        </section>
      </form>

      <a href="orderList.html" class="btn btn-outline-secondary btn-sm">발주 목록으로</a>
    </div>
  </main>
</div>
<!-- 기존 layout.js 파일은 수정하지 않음 -->
<script src="../../static/js/layout.js" th:src="@{/js/layout.js}"></script>
</body>
</html>
